services:
  web:
    build:
      context: .
      target: production
      args:
        PUBLIC_GTM_ID: ${PUBLIC_GTM_ID:-}
        PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
        PUBLIC_CLARITY_ID: ${PUBLIC_CLARITY_ID:-}
        PUBLIC_META_PIXEL_ID: ${PUBLIC_META_PIXEL_ID:-}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
        PUBLIC_GOOGLE_MAPS_EMBED_URL: ${PUBLIC_GOOGLE_MAPS_EMBED_URL:-}
        PUBLIC_GOOGLE_SITE_VERIFICATION: ${PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        PUBLIC_FORM_ACTION_URL: ${PUBLIC_FORM_ACTION_URL:-/bg/scripts/contact-form.php}
        PUBLIC_FORM_API_URL: ${PUBLIC_FORM_API_URL:-/bg/api/quote/}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  dev:
    profiles:
      - dev
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-4321}:4321"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development

volumes:
  dev_node_modules:
